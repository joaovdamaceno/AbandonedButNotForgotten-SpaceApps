<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{{ PRODUCT_NAME }}}</title>
<style>html,body{margin:0;width:100%;height:100%;background:#060b10;color:#e4ded0;font:16px system-ui}#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#060b10;gap:16px}h1{letter-spacing:.14em;font-weight:400;font-size:clamp(18px,3vw,32px)}small{color:#83aaa8;letter-spacing:.16em}progress{width:min(420px,80vw);height:6px;accent-color:#9bada6}#error{color:#edb08a;max-width:600px;white-space:pre-wrap}#full{position:absolute;right:10px;bottom:10px;background:#14252a;color:#ddd9c8;border:1px solid #547074;padding:7px 12px;cursor:pointer}#qa{position:absolute;top:0;right:0;font:11px monospace;background:#000c;color:#8fd8ac;pointer-events:none;display:none}</style></head>
<body><main id="stage"><canvas id="game" width="960" height="600" tabindex="0" aria-label="Abandoned, But Not Forgotten"></canvas></main><section id="loading"><small>ARQUIVO DE MISSÕES / MISSION ARCHIVE</small><h1>ABANDONED, BUT NOT FORGOTTEN</h1><progress id="progress" max="1" value="0"></progress><span id="status">Preparando a missão · Preparing the mission</span><p id="error"></p></section><button id="full" aria-label="Fullscreen">⛶</button><pre id="qa"></pre>
<script>
const canvas=document.getElementById('game'),stage=document.getElementById('stage');
function resize(){const w=stage.clientWidth,h=stage.clientHeight,scale=Math.min(1,1280/w,720/h);canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));}resize();addEventListener('resize',resize);
if(new URLSearchParams(location.search).has('qa'))document.getElementById('qa').style.display='block';
document.getElementById('full').onclick=()=>stage.requestFullscreen?.();canvas.addEventListener('pointerdown',()=>canvas.focus());
const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'{{{ COMPANY_NAME }}}',productName:'{{{ PRODUCT_NAME }}}',productVersion:'{{{ PRODUCT_VERSION }}}',matchWebGLToCanvasSize:false,devicePixelRatio:1,showBanner:(message,type)=>{if(type==='error')document.getElementById('error').textContent=message;}};
const started=performance.now();const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onload=()=>createUnityInstance(canvas,config,p=>document.getElementById('progress').value=p).then(instance=>{window.unityInstance=instance;window.webReadyMs=performance.now()-started;document.getElementById('loading').style.display='none';canvas.focus();}).catch(e=>{document.getElementById('status').textContent='Não foi possível abrir a missão / Unable to open the mission';document.getElementById('error').textContent=String(e);});script.onerror=()=>{document.getElementById('error').textContent='Falha ao carregar o jogo. Recarregue a página. / Loading failed. Please reload.';};document.body.appendChild(script);
</script></body></html>
